<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Preview Card</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container-fluid">
    <div class="row min-vh-100 justify-content-center align-items-center p-4">

      <div class="col-11 col-sm-8 col-md-6 col-lg-4 card-column">
        <article class="card border-dark rounded-4 shadow-lg p-4">

          <img
            src="assets/images/illustration-article.jpg"
            class="card-img-top rounded-3"
            alt="Abstract yellow, black, and white article illustration">

          <div class="card-body px-0 pb-0 pt-4">
            <span class="badge text-bg-warning text-dark fw-bold px-3 py-2">
              Learning
            </span>

            <p class="small text-dark mt-3 mb-3">
              Published 21 Dec 2023
            </p>

            <h1 class="card-title h4 fw-bold mb-3">
              HTML &amp; CSS foundations
            </h1>

            <p class="card-text text-secondary mb-0">
              These languages are the backbone of every website,
              defining structure, content, and presentation.
            </p>

            <div class="d-flex align-items-center gap-2 mt-4">
              <img
                src="assets/images/image-avatar.jpg"
                class="rounded-circle author-avatar"
                alt="Angel Cruz">
              <span class="fw-bold small">Angel Cruz</span>
            </div>
          </div>

        </article>
      </div>

    </div>
  </main>
</body>
</html>

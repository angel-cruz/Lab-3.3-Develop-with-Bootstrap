<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QR Code </title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="container-fluid">
    <div class="row min-vh-100 justify-content-center align-items-center px-3">

      <div class="col-11 col-sm-7 col-md-5 col-lg-3 qr-column">
        <section class="card border-0 rounded-4 shadow text-center p-3" aria-labelledby="qr-title">
          <img
            src="qr-code.png"
            class="card-img-top rounded-3"
            alt="QR code to visit Frontend Mentor">

          <div class="card-body px-2 pt-4 pb-3">
            <h1 id="qr-title" class="card-title fs-5 fw-bold text-dark mb-3">
              Improve your front-end skills by building projects
            </h1>

            <p class="card-text text-secondary small mb-0">
              Scan the QR code to visit Frontend Mentor and take your
              coding skills to the next level
            </p>
          </div>
        </section>
      </div>

    </div>
  </main>
</body>
</html>
